  # ============================================
  # FRONTEND
  # ============================================

  frontend:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
    container_name: apivia-frontend
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - apivia-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================
# NETWORKS
# ============================================

networks:
  apivia-network:
    driver: bridge

# ============================================
# VOLUMES
# ============================================

volumes:
  postgres-data:
    driver: local
  rabbitmq-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  seq-data:
    driver: local
